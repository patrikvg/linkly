services:
  postgres:
    image: postgres:16
    container_name: linkly-postgres
    environment:
      POSTGRES_DB: linkly
      POSTGRES_USER: linkly
      POSTGRES_PASSWORD: linkly
    ports:
      - "5432:5432"
    volumes:
      - linkly_pgdata:/var/lib/postgresql/data

volumes:
  linkly_pgdata:
